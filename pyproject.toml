[project]
name = "seatfinder"
version = "0.1.0"
description = "Find live empty seats on BookMyShow and District"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "seatfinder contributors" }]
dependencies = [
    "curl_cffi>=0.7.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
seatfinder = "seatfinder.cli:main"

[project.urls]
Homepage = "https://github.com/AyushRajSinghParihar/seatfinder"
Repository = "https://github.com/AyushRajSinghParihar/seatfinder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seatfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
